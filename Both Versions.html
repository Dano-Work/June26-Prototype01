<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Bank — Both Versions</title>
<link rel="stylesheet" href="app/vs-tokens.css" />
<link rel="stylesheet" href="app/wireframe.css" />
<style>
  /* override body overflow for the canvas */
  body { overflow: hidden; background: var(--moss-900); }
  /* phones inside artboards sit flush — no stage/scaler */
  .phone {
    width: 390px !important;
    height: 844px !important;
    border-radius: 46px !important;
    box-shadow:
      0 0 0 8px var(--moss-800),
      0 0 0 10px rgba(0,0,0,0.3),
      0 32px 64px -24px rgba(0,0,0,0.5) !important;
  }
  /* artboard label contrast on the dark canvas */
  .dc-label { color: #d6d2c8 !important; }
</style>
<link id="gfont-Raleway" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="app/data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="app/icons.jsx"></script>
<script type="text/babel" src="app/bank-app.jsx"></script>

<script type="text/babel">
function CanvasRoot() {
  return (
    <DesignCanvas>
      <DCSection
        id="journeys"
        title="Customer journeys"
        subtitle="New customer (discover & apply) · Returning customer — John (existing accounts + transactions)"
      >
        <DCArtboard id="new" label="New customer — discover & apply" width={390} height={844}>
          <BankingApp mode="new" />
        </DCArtboard>

        <DCArtboard id="returning" label="Returning customer — John" width={390} height={844}>
          <BankingApp mode="returning" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CanvasRoot />);
</script>
</body>
</html>
