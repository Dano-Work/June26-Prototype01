<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Banking Search — Wireframes</title>
<link rel="stylesheet" href="ds/colors_and_type.css" />
<link rel="stylesheet" href="wireframe.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  /* keep wrapper out of layout flow but still drive inheritance + selectors */
  .wf { display: contents; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakToggle } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#4a8fa8",
  "sketch": false,
  "notes": true
}/*EDITMODE-END*/;

// phone artboard size
const PW = 300, PH = 600;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const wrapStyle = { "--wf-accent": t.accent, "--ds-accent": t.accent };
  return (
    <div className="wf" data-sketch={t.sketch ? "on" : "off"} data-notes={t.notes ? "on" : "off"} style={wrapStyle}>
      <DesignCanvas>
        <DCSection id="landing" title="1 · Landing — the front door" subtitle="Personalized greeting, search is the home screen">
          <DCArtboard id="land-min" label="A · Search only" width={PW} height={PH}><LandingMinimal /></DCArtboard>
          <DCArtboard id="land-quick" label="B · With quick prompts" width={PW} height={PH}><LandingQuick /></DCArtboard>
        </DCSection>

        <DCSection id="suggest" title="2 · Auto-suggest — filters as you type" subtitle="Attached dropdown; more letters narrow the list">
          <DCArtboard id="sug-sav" label="“Sav” → all savings" width={PW} height={PH}><SuggestSavings /></DCArtboard>
          <DCArtboard id="sug-isa" label="“Savings ISA” → narrowed" width={PW} height={PH}><SuggestISA /></DCArtboard>
          <DCArtboard id="sug-blend" label="“Curre” → yours + new" width={PW} height={PH}><SuggestBlended /></DCArtboard>
        </DCSection>

        <DCSection id="results" title="3 · Results — tap return → panels" subtitle="Conversational header + persistent refine box">
          <DCArtboard id="res-stack" label="A · Vertical stack" width={PW} height={PH}><ResultsStack /></DCArtboard>
          <DCArtboard id="res-carousel" label="B · Swipe carousel" width={PW} height={PH}><ResultsCarousel /></DCArtboard>
        </DCSection>

        <DCSection id="card" title="4 · Product card — Apply" subtitle="Detail slides up as a sheet; Apply lives inside it">
          <DCArtboard id="card-sheet" label="A · Slide-up sheet" width={PW} height={PH}><CardSheet /></DCArtboard>
          <DCArtboard id="card-direct" label="B · Straight from suggestion" width={PW} height={PH}><CardDirect /></DCArtboard>
        </DCSection>

        <DCSection id="account" title="5 · Existing account — manage" subtitle="Your own accounts open to a management view">
          <DCArtboard id="acct" label="Account detail" width={PW} height={PH}><AccountView /></DCArtboard>
        </DCSection>

        <DCSection id="nav" title="6 · Traditional nav — slide-out" subtitle="Burger → category list with + expanders">
          <DCArtboard id="nav-list" label="A · Category list" width={PW} height={PH}><MenuNav /></DCArtboard>
          <DCArtboard id="nav-exp" label="B · Expanded" width={PW} height={PH}><MenuExpanded /></DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Style" />
        <TweakColor label="Accent" value={t.accent}
          options={["#4a8fa8", "#1f8a5b", "#243b6b", "#b5651d"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakToggle label="Hand-drawn edges" value={t.sketch} onChange={(v) => setTweak("sketch", v)} />
        <TweakToggle label="Show annotations" value={t.notes} onChange={(v) => setTweak("notes", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
